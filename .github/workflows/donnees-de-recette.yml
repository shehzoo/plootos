# "Données de recette": wipes the staging database ("recette", separate Cloudflare account,
# fictitious data only), applies the migrations again, then loads a fictitious data set.
# Launched by hand ("Run workflow"), on main or on the branch of a lot. Never touches production:
# it only has the secrets of the "staging" GitHub environment.
name: Données de recette

on:
  workflow_dispatch:
    inputs:
      jeu:
        description: Jeu de données fictives
        type: choice
        options: [exemple, exemple-15-03, exemple-sans-operations, cas-a-b, 3-ans, vide]
        default: exemple

permissions:
  contents: read

jobs:
  data:
    name: Données de recette
    runs-on: ubuntu-latest
    environment: staging
    # Same group as the staging deployments, never cancelled: a deployment waits for the data,
    # and the data wait for a deployment.
    concurrency:
      group: staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Préparation
        env:
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
          JEU: ${{ inputs.jeu }}
        run: |
          # Each allowed address is masked in the public logs before anything else runs.
          npx tsx scripts/seed.ts mask
          npx tsx scripts/seed.ts drop > "$RUNNER_TEMP/drop.sql"
          npx tsx scripts/seed.ts data "$JEU" > "$RUNNER_TEMP/data.sql"
      - name: Base vidée
        run: npx wrangler d1 execute DB --env staging --remote --yes --file "$RUNNER_TEMP/drop.sql" > /dev/null
      - name: Changements de schéma
        run: npx wrangler d1 migrations apply DB --env staging --remote
      - name: Données chargées
        env:
          JEU: ${{ inputs.jeu }}
        run: |
          npx wrangler d1 execute DB --env staging --remote --yes --file "$RUNNER_TEMP/data.sql" > /dev/null
          rm -f "$RUNNER_TEMP/drop.sql" "$RUNNER_TEMP/data.sql"
          echo "Jeu « $JEU » chargé en recette."
